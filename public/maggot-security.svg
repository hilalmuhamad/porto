<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
  <defs>
    <linearGradient id="sbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0c0c0e"/>
      <stop offset="1" stop-color="#121316"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="750" fill="url(#sbg)"/>
  <g stroke="#ffffff" stroke-opacity="0.04">
    <path d="M0 125h1200M0 250h1200M0 375h1200M0 500h1200M0 625h1200M200 0v750M400 0v750M600 0v750M800 0v750M1000 0v750"/>
  </g>

  <text x="90" y="100" fill="#f4f4f5" font-size="34" font-weight="bold" font-family="Manrope, Arial, sans-serif">Security Hardening Layers</text>
  <text x="90" y="132" fill="#71717a" font-size="18">every request passes 5 gates before reaching the API</text>

  <g font-size="22" font-weight="bold">
    <rect x="90" y="180" width="1020" height="76" rx="16" fill="#052e22" stroke="#34d399" stroke-opacity="0.5"/>
    <text x="130" y="222" fill="#34d399">01</text>
    <text x="185" y="222" fill="#f4f4f5" font-family="Manrope, Arial, sans-serif">JWT API Authentication</text>
    <text x="1070" y="222" fill="#6ee7b7" text-anchor="end">identity</text>

    <rect x="90" y="272" width="1020" height="76" rx="16" fill="#131316" stroke="#3f3f46"/>
    <text x="130" y="314" fill="#a1a1aa">02</text>
    <text x="185" y="314" fill="#f4f4f5" font-family="Manrope, Arial, sans-serif">Cloudflare WAF</text>
    <text x="1070" y="314" fill="#71717a" text-anchor="end">edge filter</text>

    <rect x="90" y="364" width="1020" height="76" rx="16" fill="#131316" stroke="#3f3f46"/>
    <text x="130" y="406" fill="#a1a1aa">03</text>
    <text x="185" y="406" fill="#f4f4f5" font-family="Manrope, Arial, sans-serif">Suricata IDS / IPS</text>
    <text x="1070" y="406" fill="#71717a" text-anchor="end">intrusion detection</text>

    <rect x="90" y="456" width="1020" height="76" rx="16" fill="#131316" stroke="#3f3f46"/>
    <text x="130" y="498" fill="#a1a1aa">04</text>
    <text x="185" y="498" fill="#f4f4f5" font-family="Manrope, Arial, sans-serif">Fail2Ban + Tailscale VPN</text>
    <text x="1070" y="498" fill="#71717a" text-anchor="end">private access</text>
  </g>

  <g font-size="20" font-weight="bold">
    <rect x="90" y="580" width="330" height="52" rx="26" fill="#052e22" stroke="#34d399" stroke-opacity="0.5"/>
    <text x="255" y="613" fill="#34d399" text-anchor="middle">Nmap: 0 exposed ports</text>
    <rect x="436" y="580" width="250" height="52" rx="26" fill="#18181b" stroke="#3f3f46"/>
    <text x="561" y="613" fill="#a1a1aa" text-anchor="middle">0% error rate</text>
  </g>
</svg>
